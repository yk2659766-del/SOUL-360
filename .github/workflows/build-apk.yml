name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME" || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # Surface the important lines as annotations (readable without log access).
            grep -E "^e: |What went wrong|Could not|error:|Unresolved|> " build.log | head -60 > errors.txt
            i=0
            while [ $i -lt 60 ]; do
              chunk=$(sed -n "$((i+1)),$((i+6))p" errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
              [ -z "$chunk" ] && break
              echo "::error title=Build error $((i/6+1))::$chunk"
              i=$((i+6))
            done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Soul360Design-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a direct download (Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Soul360Design.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Soul360Design.apk --title "SOUL 360 DESIGN (latest build)" \
            --notes "Tap Soul360Design.apk below to download, then open it to install." --target "$GITHUB_SHA"

  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cd backend && python -m unittest discover -s tests -v
